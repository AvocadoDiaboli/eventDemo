<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veranstaltungsanzeige</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            padding: 40px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        h1 {
            font-size: 36px;
            margin-bottom: 25px;
            color: #58a6ff;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px solid #30363d;
            padding-bottom: 15px;
        }
        .table-container {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 26px;
            table-layout: auto;
        }
        th, td {
            padding: 22px 24px;
            text-align: left;
            border-bottom: 1px solid #30363d;
        }
        th {
            background-color: #161b22;
            color: #8b949e;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 20px;
            letter-spacing: 1px;
        }
        th.col-fit, td.col-fit {
            width: 1%;
            white-space: nowrap;
        }
        th.col-expand, td.col-expand {
            width: auto;
        }
        tr:nth-child(even) {
            background-color: rgba(22, 27, 34, 0.4);
        }
        .ongoing-row {
            background-color: rgba(31, 111, 235, 0.15) !important;
            border-left: 6px solid #1f6feb;
        }
        .badge {
            display: inline-block;
            background-color: #1f6feb;
            color: white;
            font-size: 16px;
            padding: 4px 10px;
            border-radius: 4px;
            margin-left: 12px;
            vertical-align: middle;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .no-events {
            text-align: center;
            padding: 60px;
            font-size: 30px;
            color: #8b949e;
        }
        .footer-status {
            margin-top: 15px;
            font-size: 16px;
            color: #8b949e;
            text-align: right;
        }
    </style>
</head>
<body>

    <h1>Kommende Veranstaltungen</h1>
    
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th class="col-fit">Datum</th>
                    <th class="col-fit">Zeit</th>
                    <th class="col-fit">Veranstaltung</th>
                    <th class="col-expand">Ort</th>
                </tr>
            </thead>
            <tbody id="event-table-body">
                <tr><td colspan="4" class="no-events">Veranstaltungen werden geladen...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="footer-status" id="last-updated">Automatische Live-Anzeige</div>

    <script>
        // HIER DEN VERÖFFENTLICHTEN GOOGLE SHEETS CSV-LINK EINFÜGEN
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ--Ad6bot2cV0r_jpQlJeLFk2Sf5M7-FiP6mE0SWzWz3n4NaUYTl_1_MMzzuvrfOY-ZPqlTI2ygUSi/pubhtml?gid=0&single=true';

        function formatDateGerman(dateStr) {
            if (!dateStr) return '';
            const cleaned = dateStr.trim();
            const parts = cleaned.split('-');
            if (parts.length === 3) {
                return `${parts[2].padStart(2, '0')}.${parts[1].padStart(2, '0')}.${parts[0]}`;
            }
            return cleaned;
        }

        function parseLocalDate(dateStr) {
            if (!dateStr) return null;
            const cleaned = dateStr.trim();
            const parts = cleaned.split('-');
            if (parts.length === 3) {
                const y = parseInt(parts[0], 10);
                const m = parseInt(parts[1], 10) - 1;
                const d = parseInt(parts[2], 10);
                return new Date(y, m, d, 0, 0, 0, 0);
            }
            // Fallback for other standard date formats
            const d = new Date(cleaned);
            if (isNaN(d.getTime())) return null;
            d.setHours(0, 0, 0, 0);
            return d;
        }

        function parseCSV(text) {
            // Strip invisible BOM characters from UTF-8 CSVs exported by Google Sheets
            let cleanText = text.replace(/^\uFEFF/, '');
            let lines = cleanText.split(/\r?\n/).filter(line => line.trim() !== '');
            if (lines.length === 0) return [];

            let headers = parseCSVLine(lines[0]);
            // Clean invisible BOM or quotes off the first header key just in case
            if (headers.length > 0) {
                headers[0] = headers[0].replace(/^\uFEFF/, '').trim();
            }
            
            console.log("Parsed CSV Headers:", headers); // Visible in F12 console

            let result = [];
            for (let i = 1; i < lines.length; i++) {
                let currentLine = parseCSVLine(lines[i]);
                if (currentLine.length > 0 && currentLine.some(val => val !== '')) {
                    let obj = {};
                    for (let j = 0; j < headers.length; j++) {
                        let key = headers[j] ? headers[j].trim() : `col_${j}`;
                        obj[key] = currentLine[j] ? currentLine[j].trim() : '';
                    }
                    result.push(obj);
                }
            }
            return result;
        }

        function parseCSVLine(text) {
            let result = [];
            let flag = false;
            let current = '';
            for (let i = 0; i < text.length; i++) {
                let char = text[i];
                if (char === '"') {
                    flag = !flag;
                } else if (char === ',' && !flag) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result.map(item => item.replace(/^"|"$/g, '').trim());
        }

        async function fetchAndRenderEvents() {
            try {
                const separator = CSV_URL.includes('?') ? '&' : '?';
                const response = await fetch(CSV_URL + separator + 'cacheBust=' + new Date().getTime());
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                
                const csvData = await response.text();
                const rawEvents = parseCSV(csvData);
                console.log("Raw Events Extracted:", rawEvents); // Check browser console

                const today = new Date();
                today.setHours(0, 0, 0, 0);

                let processedEvents = rawEvents.map(ev => {
                    let startStr = ev.StartDate || ev.startdate || ev.Start_Date || '';
                    let endStr = ev.EndDate || ev.enddate || ev.End_Date || startStr;

                    let startDate = parseLocalDate(startStr);
                    let endDate = parseLocalDate(endStr);
                    if (!endDate && startDate) endDate = startDate;

                    // Fallback safety if date parsing fails so rows don't completely vanish
                    let isOngoing = false;
                    if (startDate && endDate) {
                        isOngoing = (startDate <= today && endDate >= today);
                    }

                    let formattedStart = formatDateGerman(startStr);
                    let formattedEnd = formatDateGerman(endStr);

                    let dateDisplay = (!endStr || startStr === endStr)
                        ? formattedStart
                        : `${formattedStart} – ${formattedEnd}`;

                    return {
                        startDateObj: startDate,
                        endDateObj: endDate,
                        dateString: dateDisplay || startStr,
                        timeString: ev.TimeString || ev.time || ev.Time || '',
                        name: ev.EventName || ev.name || ev.Event || '',
                        location: ev.Location || ev.location || ev.Ort || '',
                        isOngoing
                    };
                });

                // Filter: keep events whose end date is today or in the future, OR events with missing dates as a fallback
                let activeOrFuture = processedEvents.filter(ev => {
                    if (!ev.endDateObj) return true; // keep if date couldn't parse so it's visible for debugging
                    return ev.endDateObj >= today;
                });

                // Sort: Ongoing first, then upcoming start dates
                activeOrFuture.sort((a, b) => {
                    if (a.isOngoing && !b.isOngoing) return -1;
                    if (!a.isOngoing && b.isOngoing) return 1;
                    if (!a.startDateObj || !b.startDateObj) return 0;
                    return a.startDateObj - b.startDateObj;
                });

                let top6Rows = activeOrFuture.slice(0, 6);
                let tbody = document.getElementById('event-table-body');
                
                if (top6Rows.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="no-events">Keine bevorstehenden Veranstaltungen geplant.</td></tr>`;
                    return;
                }

                let html = '';
                top6Rows.forEach(ev => {
                    let rowClass = ev.isOngoing ? 'class="ongoing-row"' : '';
                    let badgeHtml = ev.isOngoing ? '<span class="badge">Aktuell</span>' : '';
                    
                    html += `
                        <tr ${rowClass}>
                            <td class="col-fit">${ev.dateString}</td>
                            <td class="col-fit">${ev.timeString}</td>
                            <td class="col-fit">${ev.name}${badgeHtml}</td>
                            <td class="col-expand">${ev.location}</td>
                        </tr>
                    `;
                });

                tbody.innerHTML = html;
                document.getElementById('last-updated').innerText = `Zuletzt aktualisiert: ${new Date().toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })} Uhr`;

            } catch (error) {
                console.error('Fehler beim Laden der Veranstaltungen:', error);
                document.getElementById('event-table-body').innerHTML = `<tr><td colspan="4" class="no-events" style="color:#f85149;">Fehler beim Laden. Siehe Browser-Konsole (F12).</td></tr>`;
            }
        }

        fetchAndRenderEvents();
        setInterval(fetchAndRenderEvents, 15 * 60 * 1000);

        function scheduleMidnightRefresh() {
            const now = new Date();
            const night = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
            setTimeout(() => {
                fetchAndRenderEvents();
                scheduleMidnightRefresh();
            }, night.getTime() - now.getTime());
        }
        scheduleMidnightRefresh();
    </script>
</body>
</html>
